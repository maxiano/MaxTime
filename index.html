<div class="form-row-secondary">
                    <div style="display: flex; gap: 8px;">
                        <select id="task-project" style="flex: 1;">
                            <option value="">Seleziona Progetto</option>
                            <option value="Spes Montesacro">Spes Montesacro</option>
                            <option value="Amministrazione">Amministrazione</option>
                            <option value="Sviluppo PWA">Sviluppo PWA</option>
                        </select>
                        <button type="button" id="add-project-btn" class="secondary-btn" title="Nuovo Progetto" style="font-weight: 800;">+</button>
                    </div>

                    <select id="task-priority">
                        <option value="bassa">Priorità Bassa</option>
                        <option value="media" selected>Priorità Media</option>
                        <option value="alta">Priorità Alta</option>
                    </select>

                    <!-- Nuovi campi per Intervallo Temporale e Avanzamento -->
                    <div style="display: flex; gap: 6px;">
                        <input type="date" id="task-start-date" title="Data Inizio" style="font-size: 0.8rem; padding: 8px;">
                        <input type="date" id="task-due-date" title="Data Scadenza" style="font-size: 0.8rem; padding: 8px;">
                    </div>

                    <select id="task-progress" title="Stato di Avanzamento">
                        <option value="0">0% - Da iniziare</option>
                        <option value="25">25% - In corso</option>
                        <option value="50">50% - A metà</option>
                        <option value="75">75% - Quasi finito</option>
                        <option value="100">100% - Completato</option>
                    </select>

                    <button type="submit">Inserisci</button>
                </div>
