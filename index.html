<!DOCTYPE html>
<html lang="it">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayFlow - Time Blocking</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4f46e5; 
            --primary-hover: #4338ca;
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #0f172a; 
            --text-muted: #64748b;
            --border: #e2e8f0; 
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 24px 16px; 
            display: flex; 
            justify-content: center; 
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            width: 100%; 
            max-width: 700px; 
        }

        h1 { 
            font-size: 1.6rem; 
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 1.25rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            color: var(--text);
        }
        
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-md); 
            border: 1px solid var(--border);
            margin-bottom: 16px; 
            transition: box-shadow 0.2s ease;
        }
        
        /* Navigazione Data */
        .date-nav { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
            padding: 12px 16px;
        }
        .date-nav input[type="date"] { 
            font-size: 0.95rem; 
            font-weight: 600;
            padding: 10px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-sm); 
            text-align: center; 
            flex: 1; 
            font-family: inherit; 
            background: #f8fafc;
            color: var(--text);
            cursor: pointer;
        }
        .date-nav input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .nav-btn { 
            background: #f1f5f9; 
            color: var(--text); 
            border: 1px solid var(--border); 
            padding: 10px 14px; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.15s ease;
        }
        .nav-btn:hover { 
            background: #e2e8f0; 
            color: var(--primary);
        }

        /* Action bar per azioni rapide */
        .actions-bar { 
            display: flex; 
            justify-content: flex-end; 
            margin-bottom: 16px; 
        }
        .secondary-btn { 
            background: #ffffff; 
            color: var(--text-muted); 
            border: 1px solid var(--border); 
            padding: 8px 14px; 
            border-radius: var(--radius-sm); 
            font-size: 0.85rem; 
            cursor: pointer; 
            font-weight: 500; 
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }
        .secondary-btn:hover { 
            background: #f8fafc; 
            color: var(--text); 
            border-color: #cbd5e1;
        }

        /* Form Time Blocking con Progetti e Priorità */
        form { display: flex; flex-direction: column; gap: 12px; }
        .form-row { display: grid; grid-template-columns: 110px 130px 1fr; gap: 10px; }
        .form-row-secondary { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
        @media(max-width: 600px) { 
            .form-row { grid-template-columns: 1fr; } 
            .form-row-secondary { grid-template-columns: 1fr; }
        }
        
        input, select { 
            padding: 11px 14px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-sm); 
            font-size: 0.925rem; 
            background: #fff; 
            font-family: inherit; 
            color: var(--text);
            transition: all 0.15s ease;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        button[type="submit"] { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 11px 20px; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            font-weight: 600; 
            box-shadow: var(--shadow-sm);
            transition: background 0.15s ease, transform 0.1s ease;
        }
        button[type="submit"]:hover { 
            background: var(--primary-hover); 
        }
        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* Badge Categorie e Progetti */
        .badge { 
            font-size: 0.7rem; 
            padding: 3px 8px; 
            border-radius: 20px; 
            font-weight: 650; 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            margin-right: 6px; 
            white-space: nowrap; 
            display: inline-flex;
            align-items: center;
        }
        .badge-lavoro { background: #e0e7ff; color: #3730a3; }
        .badge-sport { background: #dcfce7; color: #166534; }
        .badge-personale { background: #f3e8ff; color: #6b21a8; }
        .badge-urgente { background: #fee2e2; color: #991b1b; }
        
        /* Badge Progetto */
        .badge-project { background: #f1f5f9; color: #475569; font-size: 0.7rem; border: 1px solid var(--border); margin-right: 6px; }

        /* Filtri Rapidi per Categoria */
        .filter-bar { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            overflow-x: auto; 
            padding-bottom: 4px; 
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        
        .filter-chip { 
            background: #fff; 
            border: 1px solid var(--border); 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--text-muted); 
            white-space: nowrap; 
            box-shadow: var(--shadow-sm);
            transition: all 0.15s ease;
        }
        .filter-chip:hover { 
            background: #f8fafc; 
            color: var(--text);
            border-color: #cbd5e1;
        }
        .filter-chip.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        /* Taccuino / Brain Dump */
        .note-card { 
            background: linear-gradient(to bottom right, #fffbeb, #fef3c7); 
            border: 1px solid #fde68a; 
        }
        .note-header { 
            font-weight: 650; 
            font-size: 0.9rem; 
            color: #92400e; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .note-textarea { 
            width: 100%; 
            min-height: 90px; 
            padding: 12px; 
            border: 1px solid #fcd34d; 
            border-radius: var(--radius-sm); 
            font-family: inherit; 
            font-size: 0.9rem; 
            background: rgba(255, 255, 255, 0.7); 
            resize: vertical; 
            box-sizing: border-box; 
            color: #78350f;
        }
        .note-textarea:focus {
            outline: none;
            background: #ffffff;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }
        .note-status { 
            font-size: 0.75rem; 
            color: #b45309; 
            font-weight: 500; 
        }

        /* Lista dei blocchi orari & Priorità */
        .time-block { 
            margin-bottom: 16px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            overflow: hidden; 
            background: #fff; 
            box-shadow: var(--shadow-sm);
        }
        .time-header { 
            background: #f8fafc; 
            padding: 10px 16px; 
            font-weight: 650; 
            font-size: 0.85rem; 
            letter-spacing: 0.025em;
            color: var(--text-muted); 
            border-bottom: 1px solid var(--border); 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 16px; 
            border-bottom: 1px solid #f1f5f9; 
            border-left: 4px solid transparent; 
            transition: background 0.1s ease;
        }
        li:hover {
            background: #f8fafc;
        }
        li:last-child { border-bottom: none; }
        
        /* Indicatori visivi di priorità sui task */
        li[data-priority="alta"] { border-left-color: #ef4444; }
        li[data-priority="media"] { border-left-color: #f59e0b; }
        li[data-priority="bassa"] { border-left-color: #3b82f6; }

        li.completed span.task-text { text-decoration: line-through; color: #94a3b8; }
        .task-content { display: flex; align-items: center; flex: 1; cursor: pointer; flex-wrap: wrap; gap: 6px; }
        .task-text { font-size: 0.95rem; font-weight: 500; color: var(--text); }
        
        .delete-btn { 
            background: transparent; 
            color: #94a3b8; 
            border: none; 
            padding: 6px; 
            font-size: 0.85rem; 
            border-radius: var(--radius-sm); 
            cursor: pointer; 
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-btn:hover { 
            background: #fee2e2; 
            color: #ef4444; 
        }
        
        .empty-slot { padding: 14px 16px; color: #94a3b8; font-size: 0.9rem; font-style: italic; }
        .task-deadline { font-size: 0.75rem; color: #64748b; margin-left: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h1><span>📅 DayFlow</span></h1>
        
        <!-- Bar Delle Date -->
        <div class="card date-nav">
            <button class="nav-btn" id="prev-day">◄</button>
            <input type="date" id="date-picker">
            <button class="nav-btn" id="next-day">►</button>
            <button class="nav-btn" id="today-btn">Oggi</button>
        </div>

        <!-- Taccuino / Brain Dump Giornaliero -->
        <div class="card note-card">
            <div class="note-header">
                <span>📝 Taccuino del Giorno (Brain Dump)</span>
                <span id="note-status" class="note-status">Salvato automatico</span>
            </div>
            <textarea id="daily-note" class="note-textarea" placeholder="Scrivi qui idee al volo, appunti o promemoria liberi per questa giornata..."></textarea>
        </div>

        <!-- Form Aggiunta Task con Orario, Categoria, Progetto e Priorità -->
        <div class="card">
            <form id="task-form">
                <div class="form-row">
                    <select id="task-time" required>
                        <option value="" disabled selected>Ora</option>
                        <option value="08:00">08:00</option>
                        <option value="09:00">09:00</option>
                        <option value="10:00">10:00</option>
                        <option value="11:00">11:00</option>
                        <option value="12:00">12:00</option>
                        <option value="13:00">13:00</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                        <option value="17:00">17:00</option>
                        <option value="18:00">18:00</option>
                        <option value="19:00">19:00</option>
                        <option value="20:00">20:00</option>
                        <option value="Inbox">Inbox</option>
                    </select>

                    <select id="task-category">
                        <option value="lavoro" selected>Lavoro</option>
                        <option value="sport">Sport</option>
                        <option value="personale">Personale</option>
                        <option value="urgente">Urgente</option>
                    </select>

                    <input type="text" id="task-input" placeholder="Attività o blocco..." required autocomplete="off">
                </div>

                <div class="form-row-secondary">
                    <!-- Selettore Progetto con tasto "+" per aggiunta rapida -->
                    <div style="display: flex; gap: 6px;">
                        <select id="task-project" style="flex: 1;">
                            <option value="">Nessun Progetto</option>
                            <option value="Spes Montesacro">Spes Montesacro</option>
                            <option value="Amministrazione">Amministrazione</option>
                            <option value="Sviluppo PWA">Sviluppo PWA</option>
                        </select>
                        <button type="button" id="add-project-btn" class="secondary-btn" title="Aggiungi nuovo progetto" style="padding: 10px 14px; font-weight: 700;">+</button>
                    </div>

                    <!-- Selettore Priorità -->
                    <select id="task-priority">
                        <option value="bassa">Priorità Bassa</option>
                        <option value="media" selected>Priorità Media</option>
                        <option value="alta">Priorità Alta</option>
                    </select>

                    <button type="submit">Pianifica</button>
                </div>
            </form>
        </div>

        <!-- Barra dei Filtri Categoria -->
        <div class="filter-bar" id="filter-bar">
            <div class="filter-chip active" data-filter="all">Tutti</div>
            <div class="filter-chip" data-filter="lavoro">Lavoro</div>
            <div class="filter-chip" data-filter="sport">Sport</div>
            <div class="filter-chip" data-filter="personale">Personale</div>
            <div class="filter-chip" data-filter="urgente">Urgente</div>
        </div>

        <!-- Azioni Rapide della Giornata -->
        <div class="actions-bar">
            <button class="secondary-btn" id="carry-over-btn">➡️ Sposta non completati a domani</button>
        </div>

        <!-- Contenitore della Giornata divisa per Blocchi -->
        <div id="schedule-container">
            <!-- Generato dinamicamente da JS -->
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
